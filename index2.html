<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >
        <fieldset>
            <legend>Préference</legend>
            
            <p>Niveau :</p>
            <input type="radio" id="debutant" name="niveau" value="debutant">
            <label for="debutant">Débutant</label><br>

            <input type="radio" id="avance" name="niveau" value="avance">
            <label for="avance">Avancé</label><br>

            <p>Technologies :</p>
            <input type="checkbox" id="html" name="technologies" value="html">
            <label for="html">HTML</label><br> 

            <input type="checkbox" id="css" name="technologies" value="css">
            <label for="css">CSS</label><br><br>

            <label for="pays">Pays:</label>
            <select id="pays" name="pays">
                <option value="">Choisir un pays</option>
                <option value="Sn">Senegal</option>
                <option value="Ml">Mali</option>
            </select><br>
        </fieldset>
    </form>
</body>
</html>
